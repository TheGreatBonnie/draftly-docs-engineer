[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authly"
version = "0.1.0"
description = "Fictional authentication platform used as a Draftly documentation benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Authly Benchmark" }
]
dependencies = [
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
authly = "authly.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/authly"]
